<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5f3f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d7a4f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15472e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="silverGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e8e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0c0c0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Neutralne tło -->
  <rect width="1400" height="900" fill="#f0f0f0"/>
  
  <!-- Grupa autolawety -->
  <g transform="translate(100,500)">
    
    <!-- Przyczepa lawety (z tyłu, widok z tyłu pojazdu) -->
    <!-- Główna platforma -->
    <rect x="650" y="-200" width="550" height="30" fill="url(#silverGradient)" rx="5"/>
    <rect x="650" y="-220" width="550" height="20" fill="#d3d3d3"/>
    
    <!-- Rampa tylna -->
    <polygon points="650,-200 650,-180 700,-180 700,-175 1200,-175 1200,-200" fill="#b0b0b0"/>
    
    <!-- Podpory rampy -->
    <rect x="1170" y="-175" width="30" height="20" fill="#888"/>
    <rect x="1190" y="-175" width="10" height="20" fill="#666"/>
    
    <!-- Osie przyczepy (3 osie) -->
    <g>
      <!-- Pierwsza oś -->
      <circle cx="780" cy="-185" r="45" fill="#f5f5f5" stroke="#333" stroke-width="4"/>
      <circle cx="780" cy="-185" r="30" fill="#ddd"/>
      <circle cx="780" cy="-185" r="10" fill="#333"/>
      
      <!-- Druga oś -->
      <circle cx="920" cy="-185" r="45" fill="#f5f5f5" stroke="#333" stroke-width="4"/>
      <circle cx="920" cy="-185" r="30" fill="#ddd"/>
      <circle cx="920" cy="-185" r="10" fill="#333"/>
      
      <!-- Trzecia oś -->
      <circle cx="1060" cy="-185" r="45" fill="#f5f5f5" stroke="#333" stroke-width="4"/>
      <circle cx="1060" cy="-185" r="30" fill="#ddd"/>
      <circle cx="1060" cy="-185" r="10" fill="#333"/>
    </g>
    
    <!-- Barierki boczne przyczepy -->
    <rect x="660" y="-235" width="530" height="15" fill="#888" rx="3"/>
    
    <!-- Łącznik przyczepy z pojazdem -->
    <rect x="600" y="-160" width="50" height="25" fill="#666"/>
    <rect x="605" y="-155" width="40" height="15" fill="#888"/>
    
    <!-- Opel Movano - podwójna kabina (zielony) -->
    
    <!-- Główna kabina -->
    <rect x="280" y="-300" width="320" height="140" fill="url(#greenGradient)" rx="10"/>
    
    <!-- Druga kabina (tylna część, podwójna) -->
    <rect x="320" y="-370" width="240" height="80" fill="url(#greenGradient)" rx="8"/>
    
    <!-- Okna pierwszej kabiny -->
    <rect x="310" y="-280" width="100" height="70" fill="#4a90e2" opacity="0.6" rx="5"/>
    <rect x="430" y="-280" width="100" height="70" fill="#4a90e2" opacity="0.6" rx="5"/>
    
    <!-- Okna drugiej kabiny -->
    <rect x="340" y="-350" width="85" height="55" fill="#4a90e2" opacity="0.6" rx="5"/>
    <rect x="440" y="-350" width="85" height="55" fill="#4a90e2" opacity="0.6" rx="5"/>
    
    <!-- Zderzak przedni -->
    <rect x="270" y="-160" width="340" height="30" fill="#222" rx="6"/>
    
    <!-- Zderzak tylny -->
    <rect x="280" y="-145" width="320" height="15" fill="#333" rx="3"/>
    
    <!-- Reflektory przednie -->
    <circle cx="285" cy="-145" r="15" fill="#fff" opacity="0.95"/>
    <circle cx="285" cy="-145" r="8" fill="#ffeb3b"/>
    <circle cx="595" cy="-145" r="15" fill="#fff" opacity="0.95"/>
    <circle cx="595" cy="-145" r="8" fill="#ffeb3b"/>
    
    <!-- Logo Opel (koło na grillu) -->
    <circle cx="440" cy="-235" r="18" fill="#fff"/>
    <circle cx="440" cy="-235" r="12" fill="#000"/>
    <circle cx="440" cy="-235" r="6" fill="#fff"/>
    
    <!-- Grill -->
    <rect x="420" y="-250" width="40" height="25" fill="#333" opacity="0.7" rx="3"/>
    
    <!-- Koła przednie -->
    <circle cx="360" cy="-135" r="50" fill="#222"/>
    <circle cx="360" cy="-135" r="38" fill="#333"/>
    <circle cx="360" cy="-135" r="28" fill="#ddd"/>
    <circle cx="360" cy="-135" r="18" fill="#555"/>
    <circle cx="360" cy="-135" r="8" fill="#222"/>
    
    <!-- Koła tylne -->
    <circle cx="520" cy="-135" r="50" fill="#222"/>
    <circle cx="520" cy="-135" r="38" fill="#333"/>
    <circle cx="520" cy="-135" r="28" fill="#ddd"/>
    <circle cx="520" cy="-135" r="18" fill="#555"/>
    <circle cx="520" cy="-135" r="8" fill="#222"/>
    
    <!-- Światło ostrzegawcze na dachu -->
    <rect x="420" y="-380" width="25" height="25" fill="#ff0000" rx="3"/>
    <rect x="425" y="-375" width="15" height="15" fill="#ff6b6b"/>
    
    <!-- Lusterka boczne -->
    <rect x="270" y="-280" width="10" height="25" fill="#111" rx="2"/>
    <rect x="600" y="-280" width="10" height="25" fill="#111" rx="2"/>
    
    <!-- Klamki -->
    <rect x="380" y="-260" width="18" height="5" fill="#333" rx="2"/>
    <rect x="510" y="-260" width="18" height="5" fill="#333" rx="2"/>
    
    <!-- Tablica rejestracyjna (tył) -->
    <rect x="480" y="-145" width="60" height="12" fill="#fff" rx="2"/>
    <text x="510" y="-136" font-family="Arial" font-size="8" fill="#000" text-anchor="middle">ELE 70U1</text>
    
    <!-- Dodatkowe detale -->
    <rect x="300" y="-320" width="280" height="8" fill="#0f3d26" rx="2"/>
    
  </g>
</svg>
